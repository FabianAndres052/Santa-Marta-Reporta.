<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Marta Reporta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-text">🌊 Santa Marta Reporta</div>
        </div>
        <nav class="nav-links">
            <a href="admin.html">Administración</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Juntos mejoramos nuestra ciudad</h1>
            <p>Plataforma ciudadana para reportar problemáticas urbanas en Santa Marta. Tu reporte ayuda a las entidades a actuar más rápido.</p>
        </section>

        <div class="container-grid">
            <!-- Formulario de Creación -->
            <section class="form-section">
                <h2>📝 Crear nuevo reporte</h2>
                <form id="reportForm">
                    <div class="form-group">
                        <label for="category">Categoría del problema</label>
                        <select id="category" name="category" required>
                            <option value="">Selecciona una categoría...</option>
                            <option value="Basuras">Basuras / Residuos</option>
                            <option value="Vías deterioradas">Vías deterioradas / Huecos</option>
                            <option value="Alumbrado público">Alumbrado público dañado</option>
                            <option value="Fugas de agua">Fugas de agua</option>
                            <option value="Espacios públicos">Deterioro de espacios públicos</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="location">Ubicación exacta (Barrio, Dirección)</label>
                        <input type="text" id="location" name="location" placeholder="Ej. Barrio Pescaíto, Calle 7 con Cra 11" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Descripción detallada</label>
                        <textarea id="description" name="description" rows="4" placeholder="Describe el problema que encontraste..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="image">Fotografía de evidencia (Opcional)</label>
                        <input type="file" id="image" name="image" accept="image/jpeg, image/jpg, image/png, image/webp">
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Enviar Reporte</button>
                </form>
            </section>

            <!-- Lista de Reportes -->
            <section class="reports-section">
                <h2>Últimos reportes ciudadanos</h2>
                <div class="reports-grid" id="reportsGrid">
                    <!-- Los reportes se cargarán aquí dinámicamente mediante JS -->
                    <p>Cargando reportes...</p>
                </div>
            </section>
        </div>
    </main>

    <div id="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
