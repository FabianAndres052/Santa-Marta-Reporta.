<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Santa Marta Reporta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-text">⚙️ Panel de Administración</div>
        </div>
        <nav class="nav-links">
            <a href="index.html">← Volver al Portal</a>
        </nav>
    </header>

    <main>
        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Categoría</th>
                        <th>Ubicación</th>
                        <th>Descripción</th>
                        <th>Evidencia</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="adminReportsTable">
                    <tr><td colspan="7">Cargando reportes...</td></tr>
                </tbody>
            </table>
        </div>

    <div id="toast"></div>

    <script src="js/admin.js"></script>

</html>
