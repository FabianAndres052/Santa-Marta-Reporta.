# ==============================================================================
# Configuración NGINX para Santa Marta Reporta
# Sistema Distrital de Incidencias Urbanas
# Ubicación en servidor: /etc/nginx/sites-available/santa-marta-reporta.conf
# ==============================================================================

# Definición del upstream hacia la aplicación Node.js
upstream app_santa_marta {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Servidor HTTP (Puerto 80)
# Redirige a HTTPS en producción o sirve tráfico directamente con Proxy Inverso
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _ localhost; # Cambiar por el dominio o IP pública de AWS EC2

    # Límite de carga para evidencias fotográficas (10 Megabytes)
    client_max_body_size 10M;

    # Compresión Gzip para alto rendimiento y bajo consumo de ancho de banda
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cabeceras de Seguridad HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Servir archivos estáticos subidos (/uploads) directamente desde Nginx
    location /uploads/ {
        alias /var/www/santa-marta-reporta/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Caché para librerías JS locales (Leaflet, SheetJS, jsPDF)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/santa-marta-reporta/public;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @proxy_node;
    }

    # Proxy inverso principal hacia la aplicación Express / Node.js
    location / {
        proxy_pass http://app_santa_marta;
        proxy_http_version 1.1;

        # Cabeceras requeridas para WebSockets y HTTP Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeceras para preservar IP real del cliente y protocolo
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de conexión
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    location @proxy_node {
        proxy_pass http://app_santa_marta;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ruta de verificación de salud
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}

